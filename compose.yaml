services:
  meozlabs-web:
    build: ./web
    image: meozlabs-web:latest
    container_name: meozlabs_web
    restart: unless-stopped
    # Docker bridge address only: reachable by NPM on the same host, not by the LAN or the internet.
    ports:
      - "172.17.0.1:4300:80"
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
