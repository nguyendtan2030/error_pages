# Included in the server block and in every location that sets its own add_header
# (nginx drops server-level add_header in a location that declares any).
# No HSTS here: NPM and Cloudflare terminate TLS.
#
# The nonce is a fresh random value per response ($request_id). The page itself has no
# inline script; the nonce is for Cloudflare's JavaScript Detections, which a Free zone
# cannot turn off: Cloudflare reads the nonce from this header and puts it on the inline
# script it injects. 'unsafe-inline' stays out.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
