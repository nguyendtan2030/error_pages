# Included in the server block and in every location that sets its own add_header
# (nginx drops server-level add_header in a location that declares any).
# No HSTS here: NPM and Cloudflare terminate TLS.
#
# Scripts run only with the nonce, a fresh random value per response ($request_id):
# default.conf stamps it on the page's own <script> and modulepreload tags, and Cloudflare
# reads it from this header and puts it on the JavaScript Detections script it injects (a
# Free zone cannot turn that off). 'strict-dynamic' lets those trusted scripts load what
# they create themselves, such as Angular's lazy chunks and the inline script Cloudflare's
# detection adds inside its iframe. Browsers that know 'strict-dynamic' ignore 'self';
# older ones fall back to it. 'unsafe-inline' stays out.
add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic' 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
