server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Angular's hashed bundles, e.g. main-33VGVYDX.js, styles-G5UCFJOU.css.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The page itself: revalidate on every load so a deploy is live at once.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;

        # Stamp the CSP nonce (same $request_id as the header) on the page's scripts and
        # module preloads. sub_filter touches text/html only.
        sub_filter_once off;
        sub_filter '<script' '<script nonce="$request_id"';
        sub_filter '<link rel="modulepreload"' '<link rel="modulepreload" nonce="$request_id"';
    }
}
