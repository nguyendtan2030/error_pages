<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - MeozLabs</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d0b13">
    <link rel="icon" href="/_meoz/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/_meoz/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="/_meoz/error.css?v=2" rel="stylesheet">
</head>
<body class="is-404">
    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <main class="card">
        <div class="emblem" aria-hidden="true">
            <div class="ring ring-2"></div>
            <div class="ring ring-1"></div>
            <div class="scan"></div>
            <picture>
                <source srcset="/_meoz/meoz-lab-radar-300.webp" type="image/webp">
                <img src="/_meoz/meoz-lab-radar-300.jpg" alt="" width="300" height="300" decoding="async">
            </picture>
        </div>
        <p class="kicker">Error 404</p>
        <h1>Target Not Found</h1>
        <p class="message">The page you are looking for has been moved or doesn't exist within the <strong>MeozLabs Infrastructure</strong>.</p>
        <div class="status" role="status">
            <span class="dot" aria-hidden="true"></span>
            Target unreachable
        </div>
    </main>

    <footer class="branding">
        <span class="branding-text">Running on</span>
        <span class="branding-logo">MeozLabs Server</span>
    </footer>
</body>
</html>
